<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still — phone</title>
<link rel="stylesheet" href="../base.css">
<style>
:root {
  --bg: #f3f5ef; --surface: #fcfdf9; --ink: #22302a; --muted: #7a887e;
  --faint: #a5b0a7; --line: #e1e7dd; --sage: #a9bfa8; --deep: #2f4a3b;
  --clay: #c99f8b; --clay-deep: #a9775f;
  --sans: "Avenir Next", Avenir, "Helvetica Neue", sans-serif;
  --serif: "Iowan Old Style", Baskerville, Georgia, serif;
}
body {
  font-family: var(--sans); color: var(--ink);
  background:
    radial-gradient(420px 300px at 88% -6%, #e2ecdf 0%, rgba(226,236,223,0) 70%),
    radial-gradient(500px 380px at -10% 104%, #e9eee1 0%, rgba(233,238,225,0) 70%),
    linear-gradient(180deg, #f1f4ec 0%, #f8f9f4 46%, #eff2e9 100%);
}
.phone::before {
  content: ""; position: absolute; width: 330px; height: 330px; border-radius: 50%;
  border: 1px solid rgba(169,191,168,.28); right: -186px; top: 92px; pointer-events: none;
}
.statusbar { color: var(--ink); }
.page { position: relative; min-height: calc(844px - 47px); padding: 0 26px 78px; }

.top { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; height: 28px; }
.brand { display: flex; align-items: center; gap: 7px; }
.brand svg { width: 15px; height: 15px; color: var(--deep); }
.brand .name { font-family: var(--serif); font-style: italic; font-size: 23px; letter-spacing: -.01em; color: var(--deep); }
.brand .name::after { content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--clay); margin-left: 3px; vertical-align: 6px; }
.date { font-size: 8.5px; font-weight: 600; letter-spacing: .16em; color: var(--faint); text-transform: uppercase; }

.greet { margin-top: 28px; }
.kicker { font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.greet h1 { font-size: 30px; font-weight: 300; line-height: 1.22; letter-spacing: -.015em; margin-top: 7px; }
.greet h1 em { font-family: var(--serif); font-style: italic; color: var(--clay-deep); font-weight: 400; }

.people { display: flex; align-items: center; gap: 15px; margin-top: 18px; }
.person { font-size: 11.5px; font-weight: 500; color: var(--faint); letter-spacing: .01em; padding: 2px 0; position: relative; }
.person.active { color: var(--deep); }
.person.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 1.5px; background: var(--clay); }
.person + .person::before { content: ""; position: absolute; left: -8px; top: 50%; width: 2px; height: 2px; border-radius: 50%; background: #c8d1c6; transform: translateY(-50%); }

.focus { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 28px; }
.focus-copy { min-width: 0; }
.focus h2 { font-size: 43px; font-weight: 300; line-height: 1; letter-spacing: -.03em; margin-top: 6px; }
.focus p { font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 8px; }
.ringwrap { position: relative; width: 116px; height: 116px; flex: none; }
.ringwrap::before {
  content: ""; position: absolute; inset: -10px; border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.9), rgba(236,241,232,.2) 70%);
  box-shadow: 0 18px 40px -30px rgba(47,74,59,.4);
}
.ringwrap svg { position: relative; width: 116px; height: 116px; transform: rotate(-90deg); }
.ringtrack { fill: none; stroke: #dfe7db; stroke-width: 3.5; }
.ringbar { fill: none; stroke: var(--deep); stroke-width: 3.5; stroke-linecap: round; }
.ringlabel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.ringlabel b { font-size: 25px; font-weight: 300; letter-spacing: -.03em; }
.ringlabel b span { color: var(--faint); }
.ringlabel em { font-style: normal; font-size: 7.5px; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }

.panel {
  margin-top: 24px; background: rgba(255,255,255,.64); border: 1px solid rgba(203,213,199,.5);
  border-radius: 22px; padding: 2px 20px 0; box-shadow: 0 24px 50px -42px rgba(45,70,55,.55);
  backdrop-filter: blur(6px);
}
.checklist li { display: flex; align-items: center; gap: 13px; height: 64px; border-top: 1px solid #edf0e9; }
.checklist li:first-child { border-top: 0; }
.check {
  width: 25px; height: 25px; flex: none; border-radius: 50%; border: 1.2px solid #b7c8b5;
  display: grid; place-items: center; color: transparent; background: rgba(255,255,255,.5);
}
.check svg { width: 12px; height: 12px; }
.checklist li.done .check { background: var(--deep); border-color: var(--deep); color: #f6f8f1; }
.label { flex: 1; font-size: 14.5px; font-weight: 450; }
.checklist li.done .label { color: #839187; }
.next { display: flex; align-items: center; gap: 5px; font-size: 7.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--clay-deep); }
.next i { width: 5px; height: 5px; border-radius: 50%; background: var(--clay); display: block; }
.panel-foot { display: flex; align-items: center; justify-content: space-between; height: 43px; border-top: 1px solid #edf0e9; }
.panel-foot span { font-size: 10px; color: var(--muted); letter-spacing: .02em; }
.panel-foot .time { display: flex; align-items: center; gap: 4px; }
.panel-foot .time svg { width: 11px; height: 11px; color: var(--faint); }

.rhythm { margin-top: 22px; }
.rhythm-head { display: flex; align-items: baseline; justify-content: space-between; }
.streak { font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--clay-deep); }
.days { display: flex; justify-content: space-between; margin-top: 9px; }
.day { width: 38px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.day span { font-size: 7.5px; font-weight: 650; letter-spacing: .1em; color: var(--faint); }
.day i { width: 7px; height: 7px; border-radius: 50%; background: transparent; border: 1px solid #cfd9cd; display: block; }
.day.done i { background: var(--sage); border-color: var(--sage); }
.day.today i { width: 9px; height: 9px; background: transparent; border: 1.4px solid var(--deep); box-shadow: 0 0 0 3px rgba(47,74,59,.06); }
.day.today span { color: var(--deep); }
.day.future i { border-style: dotted; border-color: #d8e0d5; }

.quote { margin-top: 22px; text-align: center; font-family: var(--serif); font-style: italic; font-size: 14px; color: #93a095; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; width: 390px; height: 68px; padding: 8px 40px 0;
  display: flex; justify-content: space-between; align-items: flex-start;
  background: linear-gradient(180deg, rgba(243,245,239,0) 0%, rgba(243,245,239,.94) 38%);
  border-top: 1px solid rgba(225,231,221,.85); z-index: 10;
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 8px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 3px 8px; }
.tab svg { width: 17px; height: 17px; }
.tab.active { color: var(--deep); }
.tab.active svg { color: var(--deep); }
.homebar { background: rgba(34,48,42,.45); }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span class="time">8:41</span>
    <svg viewBox="0 0 66 12" fill="none" aria-hidden="true">
      <rect x="0" y="7" width="3" height="5" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/>
      <path d="M25 4.5c3.5-3 8.5-3 12 0M27.7 7.7c2-1.8 5.6-1.8 7.6 0M30.5 10.7c.8-.7 2.2-.7 3 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="44" y="1.5" width="19" height="9" rx="3" stroke="currentColor" stroke-width="1.1" opacity=".4"/><rect x="46" y="3.4" width="14" height="5.2" rx="1.4" fill="currentColor"/><path d="M64.5 4.3v3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
    </svg>
  </div>

  <div class="page">
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.2c2.6 4.6 5.6 7 5.6 11a5.6 5.6 0 0 1-11.2 0c0-4 3-6.4 5.6-11Z"/>
          <path d="M12 11.8v7.4M12 15.6l2.6-2.3M12 17.6l-2.3-2"/>
        </svg>
        <span class="name">still</span>
      </div>
      <span class="date">Wed &middot; 25 Nov</span>
    </header>

    <section class="greet">
      <div class="kicker">Good evening, Alex</div>
      <h1>One thing <em>left</em> today.</h1>
    </section>

    <nav class="people" aria-label="Choose a family member">
      <button class="person active">Alex</button>
      <button class="person">Sam</button>
      <button class="person">Riley</button>
      <button class="person">Avery</button>
    </nav>

    <section class="focus">
      <div class="focus-copy">
        <div class="kicker">This week&rsquo;s chore</div>
        <h2>Kitchen</h2>
        <p>Wipe and sweep after dinner.</p>
      </div>
      <div class="ringwrap" aria-label="2 of 3 complete today">
        <svg viewBox="0 0 116 116">
          <circle class="ringtrack" cx="58" cy="58" r="48"/>
          <circle class="ringbar" cx="58" cy="58" r="48" stroke-dasharray="301.6" stroke-dashoffset="100.5"/>
        </svg>
        <div class="ringlabel"><b>2<span>/</span>3</b><em>today</em></div>
      </div>
    </section>

    <section class="panel">
      <ul class="checklist" aria-label="Today&rsquo;s checklist">
        <li class="done">
          <span class="check"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2.6 7.3 3 3 5.8-6.4"/></svg></span>
          <span class="label">Wipe counters</span>
        </li>
        <li class="done">
          <span class="check"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2.6 7.3 3 3 5.8-6.4"/></svg></span>
          <span class="label">Sweep floor</span>
        </li>
        <li class="todo">
          <span class="check"></span>
          <span class="label">Take out trash</span>
          <span class="next"><i></i>next</span>
        </li>
      </ul>
      <div class="panel-foot">
        <span>2 of 3 complete today</span>
        <span class="time">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="7" cy="7" r="5.2"/><path d="M7 4.2V7l1.9 1.2"/></svg>
          about 4 min left
        </span>
      </div>
    </section>

    <section class="rhythm">
      <div class="rhythm-head">
        <span class="kicker">This week</span>
        <span class="streak">two days in a row</span>
      </div>
      <div class="days" aria-label="Week of November 23">
        <div class="day done"><span>M</span><i></i></div>
        <div class="day done"><span>T</span><i></i></div>
        <div class="day today"><span>W</span><i></i></div>
        <div class="day future"><span>T</span><i></i></div>
        <div class="day future"><span>F</span><i></i></div>
        <div class="day future"><span>S</span><i></i></div>
        <div class="day future"><span>S</span><i></i></div>
      </div>
    </section>

    <p class="quote">One thing at a time.</p>
  </div>

  <nav class="tabbar" aria-label="App sections">
    <button class="tab active">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="9" cy="9" r="3.1"/><path d="M9 1.8v1.6M9 14.6v1.6M1.8 9h1.6M14.6 9h1.6M3.9 3.9l1.1 1.1M13 13l1.1 1.1M14.1 3.9 13 5M5 13l-1.1 1.1"/></svg>
      Today
    </button>
    <button class="tab">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><rect x="2.6" y="3.6" width="12.8" height="11.8" rx="2.4"/><path d="M2.6 7.2h12.8M6.3 2v3M11.7 2v3"/></svg>
      Week
    </button>
    <button class="tab">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M3 4.6h12M3 9h12M3 13.4h7.5"/></svg>
      History
    </button>
  </nav>
  <div class="homebar"></div>
</div>
</body>
</html>
