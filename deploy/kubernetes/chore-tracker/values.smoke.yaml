# Values for a disposable test cluster without Traefik or TLS. Use this only
# to exercise startup, persistence, and probes; production requires HTTPS.
config:
  environment: development
  emailTransport: ""
  appOrigin: http://chore-tracker.127.0.0.1.nip.io
  passkeyOrigin: http://chore-tracker.127.0.0.1.nip.io
  passkeyRpId: chore-tracker.127.0.0.1.nip.io
  emailFromAddress: ""
  smtpHost: ""
  smtpUsername: ""
ingress:
  host: chore-tracker.127.0.0.1.nip.io
  tls:
    enabled: false
persistence:
  storageClassName: standard
