{{- if not .Values.persistence.existingClaim }}
{{- if not (eq .Values.persistence.accessMode "ReadWriteOnce") }}
{{- fail "persistence.accessMode must be ReadWriteOnce: SQLite supports only one writer" }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "chore-tracker.dataClaimName" . }}
  labels:
    {{- include "chore-tracker.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
