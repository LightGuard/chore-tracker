apiVersion: v1
kind: Service
metadata:
  name: {{ include "chore-tracker.fullname" . }}-frontend
  labels:
    {{- include "chore-tracker.frontendLabels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "chore-tracker.frontendSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
