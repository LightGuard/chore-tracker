apiVersion: v1
kind: Service
metadata:
  name: {{ include "chore-tracker.fullname" . }}-backend
  labels:
    {{- include "chore-tracker.backendLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "chore-tracker.backendSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
